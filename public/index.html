<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini App Roundtrip</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 32px 18px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111827);
    }
    main {
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p {
      color: var(--tg-theme-hint-color, #6b7280);
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--tg-theme-hint-color, #9ca3af);
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f3f4f6);
      color: inherit;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 12px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font: inherit;
      font-weight: 700;
    }
    button:disabled {
      opacity: .55;
    }
    #status {
      min-height: 1.5em;
      margin-top: 14px;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Send something back to the bot</h1>
    <p>The page saves your submission first, then hands Telegram only a small opaque reference.</p>

    <form id="roundtrip">
      <textarea id="note" maxlength="2000" required placeholder="Hello from the Mini App"></textarea>
      <button id="submit" type="submit">Send to bot</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp ?? null;
    tg?.ready();
    tg?.expand();

    const form = document.querySelector("#roundtrip");
    const note = document.querySelector("#note");
    const button = document.querySelector("#submit");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = note.value;
      if (!value.trim()) return;

      button.disabled = true;
      status.textContent = "Saving…";

      try {
        const response = await fetch("/api/interactions", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ note: value }),
        });

        if (!response.ok) throw new Error("submission_not_saved");
        const body = await response.json();
        if (!body || typeof body.event_ref !== "string") {
          throw new Error("missing_event_ref");
        }

        const payload = JSON.stringify({
          v: 1,
          kind: "artifact.interaction",
          ref: body.event_ref,
        });

        if (new TextEncoder().encode(payload).length > 512) {
          throw new Error("wake_payload_too_large");
        }

        if (tg && typeof tg.sendData === "function") {
          status.textContent = "Saved. Handing the reference to Telegram…";
          tg.sendData(payload);
          return;
        }

        status.textContent =
          "Saved, but this page is not running inside Telegram. Open it from the bot and submit again to complete the handoff.";
      } catch (error) {
        status.textContent = "Not sent. Check the server and try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
